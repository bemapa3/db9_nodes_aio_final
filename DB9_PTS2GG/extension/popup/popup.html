<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; margin: 0; }
    h3 { margin: 0 0 6px; font-size: 14px; }
    .row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #dc2626; }
    .dot.on { background: #16a34a; }
    button { padding: 6px 10px; cursor: pointer; font-size: 12px; border: 1px solid #d1d5db; background: white; border-radius: 4px; }
    button.primary { background: #2563eb; color: white; border-color: #2563eb; width:100%; }
    button.primary:hover { background: #1d4ed8; }
    code { background: #f3f4f6; padding: 2px 4px; border-radius: 3px; font-size: 11px; }
    #log { margin-top: 8px; font-size: 11px; color: #666; white-space: pre-wrap; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>🍌 DB9 Multi-Provider <span style="font-size:10px;color:#6b7280;">v0.4.2</span></h3>
  <div class="row"><span class="dot" id="dot"></span><span id="status">Checking bridge...</span></div>
  <div class="row">Bridge: <code>127.0.0.1:8765</code></div>
  <button id="testBtn" class="primary">🧪 Send test job (Gemini)</button>
  <div id="log"></div>
  <div class="hint">
    Presets &amp; negatives now live in the Photoshop UXP plugin — open it from
    Plugins → DB9 Multi-Provider.
  </div>
  <script src="popup.js"></script>
</body>
</html>
