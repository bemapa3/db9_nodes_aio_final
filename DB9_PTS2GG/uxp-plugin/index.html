<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PTS2GG Inpaint HUD</title>
  <style>
    :root {
      --cyber-bg: #0a0a0c;
      --cyber-surface: #121216;
      --cyber-input-bg: #050507;
      --cyber-border: rgba(0, 243, 255, 0.20);
      --cyber-border-hover: rgba(0, 243, 255, 0.40);
      
      --cyber-text: #e5e1e4;
      --cyber-muted: #849495;
      
      --neon-cyan: #00f3ff;
      --neon-blue: #0066ff;
      --neon-green: #39ff14;
      --neon-red: #e63535;
      
      --radius: 4px;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      min-width: 280px;
      box-sizing: border-box;
      background: var(--cyber-bg);
      color: var(--cyber-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Adobe Clean", sans-serif;
      font-size: 11px;
      line-height: 1.5;
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    *, *::before, *::after {
      box-sizing: inherit;
    }
    
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 243, 255, 0.2);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--neon-cyan);
    }
    
    /* SPLASH LOADING OVERLAY */
    #db9-splash {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #060608;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #db9-splash.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .db9-splash-content {
      text-align: center;
      width: 260px;
    }
    .db9-splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      box-shadow: 0 0 16px rgba(230, 53, 53, 0.45);
      margin-bottom: 14px;
      border: 1px solid rgba(230, 53, 53, 0.3);
      background: #000;
      object-fit: contain;
    }
    .db9-splash-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }
    .db9-splash-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      color: var(--cyber-muted);
      letter-spacing: 0.5px;
      margin-top: 4px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .db9-splash-loader {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .db9-splash-loader-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--neon-blue) 0%, var(--neon-cyan) 100%);
      box-shadow: 0 0 8px var(--neon-cyan);
      transition: width 0.3s ease;
    }
    .db9-splash-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* HEADER HUD (No sticky positioning to prevent UXP overlapping bug) */
    .db9-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.15);
      background: #0a0a0c;
    }
    
    #db9-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .db9-header-logo {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      object-fit: cover;
      box-shadow: 0 0 4px rgba(230, 53, 53, 0.5);
    }
    
    .db9-header-status {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .db9-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      vertical-align: middle;
    }
    .db9-dot-off { background: #475569; }
    .db9-dot-on  { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
    .db9-dot-busy{ background: var(--neon-cyan); box-shadow: 0 0 6px var(--neon-cyan); }
    .db9-dot-err { background: var(--neon-red); box-shadow: 0 0 6px var(--neon-red); }
    
    .db9-dot-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--cyber-muted);
      font-weight: 500;
    }
    
    .db9-main-pane {
      padding: 12px;
    }
    
    /* Obsidian Glass Section Cards (Solid dark gray backgrounds with solid cyan outlines) */
    .db9-section {
      background: var(--cyber-surface);
      border: 1px solid var(--cyber-border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    
    .db9-section:hover {
      border-color: var(--cyber-border-hover);
    }
    
    .db9-section-title {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    /* Inputs */
    input[type="text"], input[type="number"], textarea, select {
      background: var(--cyber-input-bg);
      border: 1px solid var(--cyber-border);
      color: var(--cyber-text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 11px;
      width: 100%;
      box-sizing: border-box;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.15);
    }
    
    textarea {
      min-height: 72px;
      resize: vertical;
    }
    
    /* Selection controls layout (Flexbox flow to ensure perfect UXP rendering) */
    .selection-controls-row {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    
    .selection-control-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    
    .small { font-size: 10px; color: var(--cyber-muted); line-height: 1.4; }
    
    /* Cyber Primary Button (Red background, cyan glows) */
    .db9-btn-primary {
      background: var(--neon-red);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      font-size: 11px;
      border-radius: var(--radius);
      padding: 10px 12px;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(230, 53, 53, 0.2);
    }
    
    .db9-btn-primary:hover:not(:disabled) {
      background: #ff4d4d;
      box-shadow: 0 0 15px rgba(230, 53, 53, 0.45);
    }
    
    .db9-btn-primary:disabled {
      background: #251213;
      color: var(--cyber-muted);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.5;
      border-color: rgba(255,255,255,0.02);
    }
    
    /* Standard buttons */
    button:not(.db9-btn-primary) {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--cyber-border);
      color: var(--cyber-text);
      border-radius: var(--radius);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    
    button:not(.db9-btn-primary):hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--cyber-border-hover);
    }
    
    button:not(.db9-btn-primary):disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    
    /* Terminal Console */
    #progressLog {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10px;
      color: var(--neon-green);
      background: #040406;
      border: 1px solid var(--cyber-border);
      border-radius: var(--radius);
      padding: 8px;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      margin-top: 8px;
    }
    
    #progressSteps {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
    }
    
    .db9-step { color: var(--cyber-muted); padding: 2px 0; font-weight: 500; }
    .db9-step.active { color: var(--neon-cyan); font-weight: 600; }
    .db9-step.done { color: var(--neon-green); }
    .db9-step.error { color: var(--neon-red); }
  </style>
</head>
<body>

  <!-- SPLASH LOADING SCREEN -->
  <div id="db9-splash">
    <div class="db9-splash-content">
      <img src="assets/logo.jpg" class="db9-splash-logo" alt="PTS2GG Logo">
      <div class="db9-splash-title">PTS2GG</div>
      <div class="db9-splash-sub">Photoshop Inpaint Automation Client</div>
      <div class="db9-splash-loader">
        <div class="db9-splash-loader-bar" id="splash-bar"></div>
      </div>
      <div class="db9-splash-status" id="splash-status">Establishing Tunnel connection...</div>
    </div>
  </div>

  <!-- HEADER HUD (Static block layout to resolve UXP overlapping bugs) -->
  <header class="db9-header">
    <div id="db9-title">
      <img src="assets/logo.jpg" class="db9-header-logo" alt="logo">
      PTS2GG
    </div>
    <div class="db9-header-status">
      <span class="db9-dot-label">Bridge</span><span class="db9-dot db9-dot-off" id="dot-bridge" title="bridge status"></span>
      <span class="db9-dot-label">Gemini</span><span class="db9-dot db9-dot-off" id="dot-gemini" title="gemini provider"></span>
      <button id="btn-reconnect" title="Reconnect to Bridge Server" style="padding: 4px 8px; font-size: 10px; margin-left: 6px;">FORCE RECONNECT</button>
    </div>
  </header>

  <!-- MAIN HUD PANES -->
  <div class="db9-main-pane">
    
    <!-- 1. PHOTOSHOP SELECTION ADJUSTMENT -->
    <section class="db9-section" id="sec-selection">
      <div class="db9-section-title">[PHOTOSHOP SELECTION BOUNDS]</div>
      <div class="selection-controls-row">
        <div class="selection-control-item">
          <span>Expand:</span>
          <select id="selectionExpandMode" style="height: 26px; padding: 2px 6px; font-size: 10px; width: 140px;">
            <option value="auto" selected>Auto Expand</option>
            <option value="manual">Manual Margin</option>
            <option value="none">Keep Original (None)</option>
          </select>
        </div>
        <div class="selection-control-item">
          <span>Margin:</span>
          <input id="selectionExpandPx" type="number" min="0" max="1024" step="8" value="96" style="height: 26px; padding: 2px 6px; font-size: 10px; width: 64px;">
          <span>px</span>
        </div>
      </div>
      <div class="small" style="margin-top: 8px;">Dynamically expands Photoshop selected pixels to form a stable 1:1 context Smart Object.</div>
    </section>

    <!-- 2. INPAINT PROMPT FIELD -->
    <section class="db9-section" id="sec-prompt">
      <div class="db9-section-title">[GENERATION PROMPT]</div>
      <textarea id="promptInput" placeholder="Mô tả ý tưởng bạn muốn thêm/sửa vào vùng chọn... (Tự động dịch sang Tiếng Anh)"></textarea>
    </section>

    <!-- 3. MAIN ACTION ACTIONS -->
    <section class="db9-section" id="sec-actions" style="border: none; padding: 0; background: transparent;">
      <button id="btn-generate" class="db9-btn-primary">GENERATE INPAINT</button>
      <button id="btn-regenerate" style="width: 100%; margin-top: 6px; font-weight: bold; border-color: rgba(0, 243, 255, 0.25);" disabled>REGENERATE LAST RESULT</button>
    </section>

    <!-- 4. MONOSPACED CONSOLE TERMINAL -->
    <section class="db9-section" id="sec-progress" style="margin-top: 10px;">
      <div class="db9-section-title">[AUTOMATION LOGGER]</div>
      <div id="progressSteps"></div>
      <div id="progressLog"></div>
    </section>
    
  </div>

  <script src="index.js"></script>
</body>
</html>
